name: Domain Sağlık Kontrolü

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */9 * * *"

jobs:
  DomainKontrol:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Python hazırla
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Domain sağlık kontrolünü çalıştır
        id: health
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p domain-health

          # Health failures are diagnostic in this helper workflow. Do not
          # let the checker’s expected exit code 1 stop the report step.
          if python doctor/http_health.py --root . --output domain-health/http-health.json; then
            CODE=0
          else
            CODE=$?
            echo "HTTP sağlık kontrolünde erişilemeyen/korunan siteler var; rapor yine de üretilecek."
          fi

          if [ ! -f domain-health/http-health.json ]; then
            echo "Sağlık kontrolü çıktı dosyası üretmedi."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("domain-health/http-health.json").read_text(encoding="utf-8")
          )

          print("Domain sağlık özeti:")
          print(f"  Sağlayıcı: {data.get('providers', 0)}")
          print(f"  OK: {data.get('ok', 0)}")
          print(f"  Protected: {data.get('protected', 0)}")
          print(f"  Hard failure: {data.get('failed', 0)}")

          for item in data.get("results", []):
              print(
                  f"  [{item.get('status', 'unknown')}] "
                  f"{item.get('name', 'unknown')} -> {item.get('url', '')}"
              )
          PY

          {
            echo "## Domain Sağlık Kontrolü"
            echo
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("domain-health/http-health.json", encoding="utf-8"))
          print(f"- Sağlayıcı: {data.get('providers', 0)}")
          print(f"- OK: {data.get('ok', 0)}")
          print(f"- Protected: {data.get('protected', 0)}")
          print(f"- Hard failure: {data.get('failed', 0)}")
          print()
          print("> Bu workflow artık silinmiş KONTROL.py dosyasını kullanmaz.")
          print("> Domain değişikliği yapmaz; yalnızca güncel sağlık raporu üretir.")
          PY
          }

          echo "http_health_exit_code=$CODE" >> "$GITHUB_OUTPUT"

          # Domain erişim sorunları raporlanır. Bu yardımcı workflow,
          # ana Kayra Doctor build/playback pipeline'ını durdurmaz.
          exit 0

      - name: Sonucu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-health-${{ github.run_id }}
          path: domain-health/http-health.json
          if-no-files-found: error
          retention-days: 14
