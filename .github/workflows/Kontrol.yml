name: Domain Değişiklik Kontrolü

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '11 */9 * * *'

jobs:
  DomainKontrol:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Python 3.11.8 Yükle
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      - name: Python Sürümünü Göster
        run: python -c "import sys; print(sys.version)"

      - name: Gereksinimleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools wheel Kekik cloudscraper pycryptodome

      - name: Betiği Çalıştır
        run: python KONTROL.py

      - name: Değişiklik Kontrolü
        id: degisiklik_kontrol
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "degisiklik=true" >> $GITHUB_OUTPUT
          fi

      - name: Pull Request Oluştur
        if: steps.degisiklik_kontrol.outputs.degisiklik == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "♻️ Domain Değişikliği"
          author: "Kayracs3 <Kayracs3@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: "domain-degisikligi"
          base: "master"
          title: "♻️ Domain Değişikliği"
          body: |
            🔄 Otomatik tespit edilen domain değişiklikleri uygulandı.

            📂 İlgili dosyalar güncellendi. Lütfen değişiklikleri gözden geçirin ve onaylayın.
          delete-branch: true
