name: CloudStream Derleyici

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"

permissions:
  contents: write

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kontrol Et
        uses: actions/checkout@v4
        with:
          ref: master

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Projedeki Dosyaları Listele (Kontrol)
        run: ls -la

      - name: Gradle Wrapper Oluştur ve İzin Ver
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Eklentileri Derle
        run: ./gradlew make --info --stacktrace

      - name: Derleme Sonrası Tüm Dosyaları Ara
        run: |
          echo "--- Bulunan .cs3 ve .json dosyaları ---"
          find . -name "*.cs3" -o -name "plugins.json" -o -name "repo.json"

      - name: Çıktıları Builds Klasörüne Kopyala
        run: |
          mkdir -p builds
          find . \( -name "*.cs3" -o -name "*.json" \) -not -path "./.git/*" -not -path "./builds/*" -exec cp {} builds/ \;
          
          # Eğer repo.json üretilmiş ama plugins.json yoksa kopyala
          if [ -f "builds/repo.json" ] && [ ! -f "builds/plugins.json" ]; then
            cp builds/repo.json builds/plugins.json
          fi

          echo "--- builds klasörünün içeriği ---"
          ls -la builds/

      - name: Derlemeleri builds Dalına Yükle
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds
          publish_branch: builds
          force_orphan: true
