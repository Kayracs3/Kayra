name: URL'den Eklenti Üret ve Test Et

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Eklenti yapılacak sitenin tam adresi (https://...)"
        required: true
        type: string
      provider_name:
        description: "İsteğe bağlı eklenti adı"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: url-plugin-builder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-test:
    name: URL'den üret ve derle
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Python hazırla
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JDK 17 ayarla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK ayarla
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: CloudStream Gradle eklentisini hazırla
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cloudstream-gradle
          git clone https://github.com/recloudstream/gradle.git /tmp/cloudstream-gradle
          cd /tmp/cloudstream-gradle
          git checkout 81b1d424d236a447d9f2e95a229faef79002f761
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon --stacktrace
          test -f "$HOME/.m2/repository/com/lagradost/cloudstream3/gradle/local-SNAPSHOT/gradle-local-SNAPSHOT.pom"

      - name: Siteyi analiz et ve Kotlin eklentisi üret
        id: generate
        shell: bash
        env:
          SITE_URL: ${{ inputs.site_url }}
          PROVIDER_NAME: ${{ inputs.provider_name }}
        run: |
          set -euo pipefail
          mkdir -p doctor-results
          python3 -m py_compile doctor/site_to_plugin.py
          python3 doctor/site_to_plugin.py \
            --mode generate \
            --url "$SITE_URL" \
            --provider-name "$PROVIDER_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --repo-root . \
            --report doctor-results/site-analysis.json \
            --metadata doctor-results/generated-provider.json
          MODULE_NAME="$(python3 -c 'import json; print(json.load(open("doctor-results/generated-provider.json"))["module_name"])')"
          echo "module_name=$MODULE_NAME" >> "$GITHUB_OUTPUT"
          echo "module_name=$MODULE_NAME"

      - name: Derle ve derleme hatalarını otomatik düzelt
        id: build
        if: steps.generate.outputs.module_name != ''
        shell: bash
        run: |
          set -uo pipefail
          MODULE_NAME="${{ steps.generate.outputs.module_name }}"
          chmod +x ./gradlew
          BUILD_OK=0
          mkdir -p doctor-results/cs3
          for attempt in 1 2 3; do
            set +e
            ./gradlew clean make makePluginsJson --no-daemon --stacktrace > "doctor-results/build-$attempt.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then BUILD_OK=1; break; fi
            {
              echo "=== KOTLIN/GRADLE DIAGNOSTICS ==="
              grep -n -E '(^e: |error:|What went wrong|Execution failed|Unresolved reference|Type mismatch|No value passed|overrides nothing|deprecated\. Use|Could not|cannot find symbol|Compilation error)' "doctor-results/build-$attempt.log" | tail -n 160 || true
              echo "=== BUILD LOG END ==="
              tail -n 35 "doctor-results/build-$attempt.log"
            } > doctor-results/build-error.txt
            if [ "$attempt" -lt 3 ]; then
              python3 doctor/site_to_plugin.py --mode repair --repo-root . \
                --report doctor-results/site-analysis.json \
                --metadata doctor-results/generated-provider.json \
                --build-log doctor-results/build-error.txt || true
            fi
          done
          if [ "$BUILD_OK" -ne 1 ]; then
            echo "build_ok=false" >> "$GITHUB_OUTPUT"
            echo "Üç denemeden sonra derleme başarısız." 
            exit 1
          fi
          CS3="$(find "$MODULE_NAME/build" -type f -name '*.cs3' -print -quit)"
          test -n "$CS3"
          cp "$CS3" "doctor-results/cs3/$MODULE_NAME.cs3"
          python3 doctor/cs3_health.py --directory doctor-results/cs3 --output doctor-results/cs3-health.json
          python3 - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path("doctor-results/generated-provider.json").read_text(encoding="utf-8"))
          data={"version":1,"providers":{m["module_name"]:{"searchQuery":m.get("search_query",m.get("display_name",m["module_name"]))}}}
          pathlib.Path("doctor-results/providers.json").write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          echo "build_ok=true" >> "$GITHUB_OUTPUT"

      - name: Kaynak kodunu ve eklentiyi CloudStream deposuna yayımla
        if: steps.build.outputs.build_ok == 'true'
        shell: bash
        env:
          MODULE_NAME: ${{ steps.generate.outputs.module_name }}
        run: |
          set -euo pipefail

          # Preserve every .cs3 produced by this successful build and the
          # generated catalogue before changing branches or rebasing source.
          test -d "$MODULE_NAME/src"
          test -f "$MODULE_NAME/build.gradle.kts"
          test -f "build/plugins.json"

          ARTIFACT_DIR="$(mktemp -d)"
          while IFS= read -r -d '' artifact; do
            filename="$(basename "$artifact")"
            if [[ -e "$ARTIFACT_DIR/$filename" ]]; then
              echo "Duplicate .cs3 output filename: $filename" >&2
              exit 1
            fi
            cp "$artifact" "$ARTIFACT_DIR/$filename"
          done < <(find . -type f -path '*/build/*.cs3' -print0)

          if ! find "$ARTIFACT_DIR" -maxdepth 1 -type f -name '*.cs3' -print -quit | grep -q .; then
            echo "No .cs3 files available for publication." >&2
            exit 1
          fi
          cp build/plugins.json "$ARTIFACT_DIR/plugins.json"
          python3 - "$ARTIFACT_DIR/plugins.json" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, list) or not data:
              raise SystemExit("Generated plugins.json is empty or has an invalid format.")
          PY

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Keep the new provider's source in master so later builds do not
          # remove it from the published plugin repository.
          git add -- "$MODULE_NAME/build.gradle.kts" "$MODULE_NAME/src"

          # Gradle updates tracked build outputs (especially build/plugins.json).
          # The successful build's .cs3 files and catalogue were already copied
          # to ARTIFACT_DIR above, so restore all unstaged tracked outputs before
          # committing/rebasing the provider source. Keep staged provider files.
          git restore --worktree -- .
          echo "Git status after restoring generated build outputs:"
          git status --short

          if ! git diff --cached --quiet; then
            git commit -m "Add URL-generated CloudStream provider: $MODULE_NAME"
            SOURCE_PUSHED=0
            for attempt in 1 2 3; do
              git fetch origin +refs/heads/master:refs/remotes/origin/master
              git rebase origin/master
              if git push origin HEAD:master; then
                SOURCE_PUSHED=1
                break
              fi
              echo "Master push attempt $attempt failed; retrying."
            done
            if [ "$SOURCE_PUSHED" -ne 1 ]; then
              echo "Unable to publish generated provider source to master." >&2
              exit 1
            fi
          else
            echo "Generated provider source is already present in master."
          fi

          # Refresh the builds branch from the remote on every retry so a
          # concurrent compiler run cannot silently drop this publication.
          git fetch origin +refs/heads/builds:refs/remotes/origin/builds
          PUBLISH_DIR="$(mktemp -d)"
          rmdir "$PUBLISH_DIR"
          git worktree add --detach "$PUBLISH_DIR" origin/builds
          PUBLISH_OK=0

          for attempt in 1 2 3; do
            git fetch origin +refs/heads/builds:refs/remotes/origin/builds
            git -C "$PUBLISH_DIR" reset --hard origin/builds
            find "$PUBLISH_DIR" -maxdepth 1 -type f -name '*.cs3' -delete
            cp "$ARTIFACT_DIR"/*.cs3 "$PUBLISH_DIR"/
            cp "$ARTIFACT_DIR/plugins.json" "$PUBLISH_DIR/plugins.json"

            git -C "$PUBLISH_DIR" config user.name "GitHub Actions"
            git -C "$PUBLISH_DIR" config user.email "actions@github.com"
            git -C "$PUBLISH_DIR" add -A
            if ! git -C "$PUBLISH_DIR" diff --cached --quiet; then
              git -C "$PUBLISH_DIR" commit -m "Publish URL-generated CloudStream provider: $MODULE_NAME"
            else
              echo "Published plugin files already match builds branch."
            fi

            if git -C "$PUBLISH_DIR" push origin HEAD:builds; then
              PUBLISH_OK=1
              break
            fi
            echo "Builds push attempt $attempt failed; refreshing and retrying."
          done

          git worktree remove --force "$PUBLISH_DIR"
          rm -rf "$ARTIFACT_DIR"

          if [ "$PUBLISH_OK" -ne 1 ]; then
            echo "Unable to publish .cs3 files and plugins.json to builds." >&2
            exit 1
          fi

          echo "Generated source and CloudStream plugin catalogue were published successfully."

      - name: Sonuçları ve .cs3 dosyasını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: url-plugin-builder-${{ github.run_id }}
          path: |
            doctor-results/
            */src/main/kotlin/com/Kayracs3/*.kt
            */build.gradle.kts
          if-no-files-found: ignore
          retention-days: 14
