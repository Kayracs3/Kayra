name: Build Plugins

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Extension
        uses: recloudstream/build-action@main
        with:
          repositoryUrl: ${{ github.repositoryUrl }}
