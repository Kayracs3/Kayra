name: Temporary Playturka Subtitle Inspection

on:
  push:
    paths:
      - ".github/workflows/PlayturkaSubtitleDebug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Playturka video API and HLS subtitles
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from urllib.error import HTTPError

          UA = "Mozilla/5.0 (Linux; Android 15; SM-A536E) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Mobile Safari/537.36"
          base = "https://p.playturka.space"
          video_id = "eFhIAsu"
          urls = [
              base + "/api/video-url?id=" + video_id,
              base + "/api/player?id=" + video_id,
              base + "/videos/" + video_id + "/master.m3u8",
              base + "/videos/" + video_id + "/index.m3u8",
          ]
          for url in urls:
              request = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "*/*",
                  "Accept-Language": "tr-TR,tr;q=0.9,en-US;q=0.8,en;q=0.7",
                  "Referer": base + "/",
                  "Origin": base,
                  "Cache-Control": "no-cache",
              })
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      body = response.read().decode("utf-8", "replace")
                      print("\\nURL", url, "STATUS", response.status, "FINAL", response.geturl(),
                            "TYPE", response.headers.get("Content-Type"), "LENGTH", len(body))
                      if ".m3u8" in url:
                          print("PLAYLIST", body[:8000])
                          print("SUBTITLE_LINES", [x for x in body.splitlines()
                                if "SUBTITLE" in x.upper() or "CLOSED-CAPTIONS" in x.upper()])
                      else:
                          print("BODY", body[:5000])
              except HTTPError as error:
                  print("\\nURL", url, "HTTP_ERROR", error.code, error.read(1500).decode("utf-8", "replace"))
              except Exception as error:
                  print("\\nURL", url, "ERROR", repr(error))
          PY
