name: Temporary Playturka Subtitle Inspection

on:
  push:
    paths:
      - ".github/workflows/PlayturkaSubtitleDebug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public player subtitle implementation
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          UA = "Mozilla/5.0 (Linux; Android 15; SM-A536E) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Mobile Safari/537.36"
          urls = [
              "https://p.playturka.space/assets/js/fm.js",
              "https://p.playturka.space/assets/js/bundle.js",
          ]
          terms = [
              r"masterUrl",
              r"rawVideoId",
              r"subtitles",
              r"subtitle",
              r"captions",
              r"\\.vtt",
              r"\\.srt",
              r"\\.ass",
              r"api/v[0-9]+/",
              r"fetch\\s*\\(",
              r"axios\\.",
              r"video[_-]?id",
          ]

          for url in urls:
              try:
                  request = urllib.request.Request(url, headers={
                      "User-Agent": UA,
                      "Accept": "*/*",
                      "Referer": "https://p.playturka.space/",
                  })
                  with urllib.request.urlopen(request, timeout=12) as response:
                      body = response.read().decode("utf-8", "replace")
                      print("\\nSCRIPT", response.status, response.geturl(), "length", len(body))
                  found = set()
                  count = 0
                  for term in terms:
                      try:
                          matches = list(re.finditer(term, body, re.I))
                      except re.error as error:
                          print("BAD_REGEX", term, error)
                          continue
                      for match in matches:
                          a, b = max(0, match.start()-240), min(len(body), match.end()+420)
                          snippet = re.sub(r"\\s+", " ", body[a:b]).strip()
                          if snippet in found:
                              continue
                          found.add(snippet)
                          print("HIT", term, snippet[:850])
                          count += 1
                          if count >= 36:
                              break
                      if count >= 36:
                          break
              except Exception as error:
                  print("FETCH_ERROR", url, repr(error))
          PY
