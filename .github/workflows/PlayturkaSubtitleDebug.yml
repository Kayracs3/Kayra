name: Temporary Playturka Subtitle Inspection

on:
  push:
    paths:
      - ".github/workflows/PlayturkaSubtitleDebug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect player data endpoint and subtitle fields
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          UA = "Mozilla/5.0 (Linux; Android 15; SM-A536E) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Mobile Safari/537.36"
          urls = [
              "https://p.playturka.space/assets/js/fm.js",
              "https://p.playturka.space/assets/js/bundle.js",
          ]
          targets = [
              "s.masterUrl", "masterUrl", "r.files", "rawVideoId",
              "subtitles&&Object.keys", "async function", "fetch(",
              "video_id", "api/v1", "getVideo", "files:"
          ]
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={
                      "User-Agent": UA, "Accept": "*/*", "Referer": "https://p.playturka.space/"
                  })
                  with urllib.request.urlopen(req, timeout=12) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      print("\\nSCRIPT", resp.status, resp.geturl(), "length", len(body))
                  seen = set()
                  count = 0
                  for target in targets:
                      pos = 0
                      matches = 0
                      while True:
                          pos = body.lower().find(target.lower(), pos)
                          if pos < 0 or matches >= 7:
                              break
                          start, end = max(0, pos-500), min(len(body), pos+1100)
                          sample = re.sub(r"\\s+", " ", body[start:end]).strip()
                          if sample not in seen:
                              seen.add(sample)
                              print("\\nCTX", target, sample[:1600])
                              count += 1
                          pos += max(1, len(target))
                          matches += 1
                          if count >= 35:
                              break
                      if count >= 35:
                          break
                  urls_found = list(dict.fromkeys(re.findall(r"""https?://[^"'`\\s<>]+""", body)))
                  print("URL_STRINGS", urls_found[:30])
              except Exception as e:
                  print("FETCH_ERROR", url, repr(e))
          PY
